name: Repository Metrics Generator

on:
  schedule:
    # Runs automatically every day at midnight UTC
    - cron: "0 0 * * *"
  # Allows manual runs from the Actions tab
  workflow_dispatch:
  # Runs whenever changes are pushed to main/master
  push:
    branches: ["main", "master"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Repository Metrics
        uses: lowlighter/metrics@latest
        with:
          # Authentication
          token: ${{ secrets.METRICS_TOKEN }}

          # Target settings
          user: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          template: repository
          filename: repository-metrics.svg

          # Output behavior
          output_action: commit
          committer_message: "chore: update repository metrics SVG [skip ci]"

          # Base content section
          base: header, activity, community

          # --- Plugins customized for a repository ---
          
          # Lines of Code Changed
          plugin_lines: yes
          plugin_lines_history_timeframe: 1 year

          # Contributor breakdown
          plugin_contributors: yes
          plugin_contributors_head: master
          plugin_contributors_ignored: bot*
          
          # Language Breakdown
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

          # Stargazer History & Map
          plugin_stargazers: yes
          plugin_stargazers_charts_type: classic

          # Repository Traffic (views/clones - requires admin access/PAT)
          plugin_traffic: yes
